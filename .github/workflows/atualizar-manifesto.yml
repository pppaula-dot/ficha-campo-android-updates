name: Atualizar manifesto Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da Release a validar (ex.: v8.3)"
        required: true
        default: "v8.3"

permissions:
  contents: write

jobs:
  atualizar-manifesto:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Definir Release
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "${TAG}" ]; then
            echo "Tag da Release não identificada."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Baixar APK da Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "${{ steps.rel.outputs.tag }}" --pattern "ficha-campo-acompanhamento.apk" --output "ficha-campo-acompanhamento.apk"

      - name: Localizar ferramentas Android
        id: android
        shell: bash
        run: |
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${AAPT}" ]; then
            echo "aapt não encontrado no runner."
            exit 1
          fi
          echo "aapt=${AAPT}" >> "${GITHUB_OUTPUT}"
          echo "apksigner=${APKSIGNER}" >> "${GITHUB_OUTPUT}"

      - name: Validar APK e ler versão
        id: apk
        shell: bash
        run: |
          BADGING="$("${{ steps.android.outputs.aapt }}" dump badging ficha-campo-acompanhamento.apk | head -n 1)"

          PACKAGE_NAME="$(printf '%s\n' "${BADGING}" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [ "${PACKAGE_NAME}" != "br.com.oam.fichacampolavra.v1" ]; then
            echo "Pacote incorreto: ${PACKAGE_NAME}"
            exit 1
          fi

          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "Não foi possível identificar versionCode/versionName."
            exit 1
          fi

          SHA256="$(sha256sum ficha-campo-acompanhamento.apk | awk '{print $1}')"

          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

          if [ -z "${{ steps.android.outputs.apksigner }}" ]; then
            echo "apksigner não encontrado; não é seguro publicar sem validar a assinatura."
            exit 1
          fi

          CERT_OUTPUT="$("${{ steps.android.outputs.apksigner }}" verify --print-certs ficha-campo-acompanhamento.apk)"
          printf '%s\n' "${CERT_OUTPUT}"

          EXPECTED_CERT_SHA256="8ad3fc3653b5669dcead7d9ffe062cbabcfc1998aaa389478cb43edc7980bbf3"
          ACTUAL_CERT_SHA256="$(printf '%s\\n' "${CERT_OUTPUT}" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"

          if [ -z "${ACTUAL_CERT_SHA256}" ]; then
            echo "Não foi possível identificar o certificado do APK."
            exit 1
          fi

          if [ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "APK recusado: assinatura diferente da V8.3."
            exit 1
          fi

          echo "Assinatura confirmada: mesma chave da V8.3."

      - name: Conferir progressão de versão
        id: guard
        shell: bash
        env:
          NEW_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          CURRENT_VERSION_CODE="$(python3 - <<'PY'
          import json
          with open("atualizacao.json", encoding="utf-8") as f:
              print(json.load(f)["versionCode"])
          PY
          )"

          echo "Versão atual no manifesto: ${CURRENT_VERSION_CODE}"
          echo "Versão do APK: ${NEW_VERSION_CODE}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${NEW_VERSION_CODE}" -lt "${CURRENT_VERSION_CODE}" ]; then
              echo "Teste recusado: APK é mais antigo que o manifesto."
              exit 1
            fi
          else
            if [ "${NEW_VERSION_CODE}" -le "${CURRENT_VERSION_CODE}" ]; then
              echo "Release recusada: versionCode deve ser maior que o atual."
              exit 1
            fi
          fi

      - name: Ler notas da Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.rel.outputs.tag }}" --jq '.body // ""' | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Gerar atualizacao.json
        if: github.event_name == 'release'
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          NOTES: ${{ steps.release.outputs.notes }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os

          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/pppaula-dot/ficha-campo-android-updates/releases/download/{os.environ['TAG']}/ficha-campo-acompanhamento.apk",
              "sha256": os.environ["SHA256"],
              "notes": os.environ["NOTES"].strip(),
          }

          with open("atualizacao.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publicar manifesto atualizado
        if: github.event_name == 'release'
        shell: bash
        run: |
          if git diff --quiet -- atualizacao.json; then
            echo "atualizacao.json já está correto."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atualizacao.json
          git commit -m "Atualiza manifesto para v${{ steps.apk.outputs.version_name }}"
          git push

      - name: Resultado do teste manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Validação concluída sem publicar atualização."
          echo "versionCode=${{ steps.apk.outputs.version_code }}"
          echo "versionName=${{ steps.apk.outputs.version_name }}"
          echo "sha256=${{ steps.apk.outputs.sha256 }}"
